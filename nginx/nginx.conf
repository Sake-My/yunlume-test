user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    upstream nav_frontend {
        server frontend:80;
        keepalive 16;
    }

    upstream nav_backend {
        server backend:8080;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Only matching POST requests consume login/install budgets. Keeping
    # OPTIONS out of the shared zones avoids penalising CORS preflight.
    map $request_method $admin_login_limit_key {
        default "";
        POST $binary_remote_addr;
    }

    map $request_method $admin_install_limit_key {
        default "";
        POST $binary_remote_addr;
    }

    # Database connection testing can involve one test plus one configure
    # request before the ordinary environment-check/complete sequence starts.
    # Keep the two budgets separate so a valid first-run flow cannot consume
    # its own completion allowance.
    map $request_method $database_install_limit_key {
        default "";
        POST $binary_remote_addr;
    }

    map $request_method $install_status_limit_key {
        default "";
        GET $binary_remote_addr;
    }

    limit_req_zone $admin_login_limit_key zone=admin_login_per_ip:10m rate=5r/m;
    limit_req_zone $admin_install_limit_key zone=admin_install_per_ip:10m rate=3r/m;
    limit_req_zone $database_install_limit_key zone=database_install_per_ip:10m rate=3r/m;
    limit_req_zone $install_status_limit_key zone=install_status_per_ip:10m rate=30r/m;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location /uploads/ {
            alias /var/www/uploads/;
            autoindex off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options nosniff always;
        }

        location = /api {
            proxy_pass http://nav_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/auth/login {
            client_max_body_size 32k;
            limit_req zone=admin_login_per_ip burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @admin_login_rate_limited;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location @admin_login_rate_limited {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 429 '{"code":429,"message":"登录尝试过于频繁，请稍后再试","data":null}';
        }

        location = /api/install/status {
            client_max_body_size 1k;
            limit_req zone=install_status_per_ip burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @install_status_rate_limited;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location @install_status_rate_limited {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 429 '{"code":429,"message":"安装状态查询过于频繁，请稍后再试","data":null}';
        }

        location = /api/install/check {
            client_max_body_size 32k;
            limit_req zone=admin_install_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @admin_install_rate_limited;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /api/install/database/test {
            client_max_body_size 96k;
            client_body_buffer_size 96k;
            access_log off;
            limit_req zone=database_install_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @admin_install_rate_limited;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /api/install/database/configure {
            client_max_body_size 32k;
            client_body_buffer_size 32k;
            access_log off;
            limit_req zone=database_install_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @admin_install_rate_limited;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 90s;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /api/install/complete {
            client_max_body_size 32k;
            limit_req zone=admin_install_per_ip burst=3 nodelay;
            limit_req_status 429;
            error_page 429 = @admin_install_rate_limited;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location @admin_install_rate_limited {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 429 '{"code":429,"message":"安装尝试过于频繁，请稍后再试","data":null}';
        }

        location = /api/admin/data/import/preview {
            client_max_body_size 66m;
            error_page 413 = @data_package_too_large;

            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location @data_package_too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 413 '{"code":413,"message":"数据包不能超过 64MiB","data":null}';
        }

        location /api/ {
            client_max_body_size 12m;
            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location ~ ^/(swagger-ui|v3/api-docs|webjars)(/|$) {
            proxy_pass http://nav_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /doc.html {
            proxy_pass http://nav_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /swagger-ui.html {
            proxy_pass http://nav_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://nav_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
