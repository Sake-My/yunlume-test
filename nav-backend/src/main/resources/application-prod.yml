spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://postgres:5432/nav_system}
    username: ${DB_USERNAME:nav_user}
    # A fresh UNCONFIGURED deployment may intentionally have no active
    # datasource yet; persisted installer settings replace this on restart.
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 0
      initialization-fail-timeout: -1
      connection-timeout: 6000
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

nav:
  database-install:
    auto-restart: ${NAV_DATABASE_AUTO_RESTART:true}
  bootstrap:
    demo-data-enabled: ${NAV_DEMO_DATA_ENABLED:false}
    admin-password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.example.nav: INFO
